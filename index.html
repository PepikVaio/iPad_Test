<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title id="pageTitle">Bindery</title>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
    :root {
        --accent: #2f5d50;
        --bg: #faf9f6;
        --ink: #1c1c1c;
        --muted: #6b6b66;
        --line: #dedad2;
    }

    * { box-sizing: border-box; }

    body {
        font-family: Georgia, "Times New Roman", serif;
        background: var(--bg);
        color: var(--ink);
        max-width: 640px;
        margin: 48px auto;
        padding: 0 20px 60px;
        line-height: 1.55;
    }

    h1 {
        font-size: 28px;
        font-weight: 600;
        margin: 0 0 6px;
        letter-spacing: -0.01em;
    }

    #subtitle {
        color: var(--muted);
        margin: 0 0 32px;
        font-size: 15px;
    }

    .row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }

    button {
        font-family: inherit;
        font-size: 14px;
        padding: 10px 18px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: #fff;
        border-radius: 3px;
        cursor: pointer;
    }

    button.secondary {
        background: transparent;
        color: var(--ink);
    }

    button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
    }

    #drop {
        border: 1px dashed var(--line);
        padding: 22px;
        text-align: center;
        border-radius: 4px;
        margin: 4px 0 20px;
        font-size: 14px;
        color: var(--muted);
    }

    #drop.over { border-color: var(--accent); color: var(--accent); }

    #status {
        border-top: 1px solid var(--line);
        margin-top: 28px;
        padding-top: 18px;
        font-size: 13px;
        color: var(--muted);
    }

    #fileSummary {
        font-size: 14px;
        margin: 4px 0 24px;
        color: var(--ink);
    }

    #log {
        white-space: pre-wrap;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 10px;
        max-height: 220px;
        overflow-y: auto;
    }

    .banner {
        font-size: 13px;
        padding: 10px 14px;
        border-radius: 4px;
        margin-bottom: 18px;
        border: 1px solid var(--line);
        background: #fff;
        display: none;
    }
    .banner.show { display: block; }
    .banner.warn { border-color: #c98a2c; color: #7a5211; }

    dialog#infoDialog {
        max-width: 480px;
        border: none;
        border-radius: 6px;
        padding: 28px 30px;
        line-height: 1.6;
        font-size: 14.5px;
    }
    dialog#infoDialog::backdrop { background: rgba(0,0,0,0.45); }
    dialog#infoDialog .content { white-space: pre-wrap; margin-bottom: 18px; }
    dialog#infoDialog button { float: right; }

    #toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--ink);
        color: #fff;
        padding: 12px 18px;
        border-radius: 4px;
        font-size: 13.5px;
        max-width: 320px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.2);
        opacity: 0;
        transform: translateY(8px);
        transition: opacity .25s, transform .25s;
        pointer-events: none;
        z-index: 50;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    input[type=file] { display: none; }
</style>
</head>
<body>

<h1 id="title">Bindery</h1>
<p id="subtitle"></p>

<div class="banner warn" id="fsaWarning"></div>

<div class="row">
    <button type="button" id="btnPickDir">…</button>
    <button type="button" class="secondary" id="btnPickFiles">…</button>
    <input type="file" id="folderInput" webkitdirectory directory multiple>
    <input type="file" id="fileInput" multiple accept=".md,.css,.ttf,.otf,.png,.jpg,.jpeg,.html">
</div>

<div id="drop"></div>
<div id="fileSummary"></div>

<button id="generate" disabled>…</button>

<div id="status">
    <div id="statusLine">—</div>
    <div id="log"></div>
</div>

<div id="toast"></div>

<dialog id="infoDialog">
    <div class="content" id="infoContent"></div>
    <button type="button" id="infoOk">OK</button>
</dialog>

<script>
/* ============================================================
   1) JAZYKY A TEXTY  (1:1 z languages.py)
   ============================================================ */

const INFO = {
cs:
"Vítej v Bindery!\n\n"+
"Bindery je nástroj pro vytváření knih ve formátu PDF z připravených souborů MD.\n\n"+

en:

"You can then edit the files, add your own chapters, images, styles, or other content.\n\n"+

"Thank you for using Bindery!\n\n"+

const TEXTS = {

    info_Generating: "Generuji knihu z vybraných souborů.",
    info_Done: "Hotovo, kniha byla uložena do vybrané složky.",
    select_Folder: "Vyber složku, ve které chceš vytvořit svou knihu:",
    error_Unsupported_Os: "Nepodporovaný operační systém.",

    // texty navíc pro webové UI (Python verze tyto dialogy řeší nativním OS,
    // web to musí mít jako viditelné popisky)
    ui_subtitle: "Vytváří PDF knihy z Markdown souborů podle tvých šablon a stylů.",
    ui_pick_dir: "Vybrat složku knihy",
    ui_pick_files: "Nahrát soubory ručně",
    ui_drop: "Nebo sem přetáhni celou složku Book (Pages, Styles, Templates, Fonts, Images)",

    ui_no_files: "Zatím nic nenačteno.",
    ui_status_idle: "Připraveno.",
    ui_fsa_warning: "Tento prohlížeč nepodporuje přímý zápis do složky (File System Access API), takže výchozí soubory se do složky automaticky nezkopírují a hotová kniha se stáhne jako soubor místo uložení do složky. Pro plnou funkčnost použij Chrome nebo Edge.",
    log_loaded_dir: "Načtena složka: {name}",
    log_first_run: "První spuštění – zakládám výchozí strukturu.",
    log_synced: "Doplněny chybějící výchozí soubory: {list}",
    log_skipped_defaults: "Nedoplněno (nedostupné, nastav DEFAULT_BOOK_BASE_URL): {list}",
    log_building: "Sestavuji dokument: {name}",
    log_rendering_page: "Stránka {page}/{count} ({name})",
    log_saved_folder: "Kniha uložena do složky jako {name}",

    log_error: "Chyba: {message}",
    log_no_chapters: "Ve složce Pages nejsou žádné kapitoly (chapter_XX.md)."
},
en: {
    info_Generating: "Generating the book from the selected files.",
    info_Done: "Done, the book was saved to the selected folder.",
    select_Folder: "Select the folder where you want to create your book:",
    error_Unsupported_Os: "Unsupported operating system.",

    ui_subtitle: "Builds PDF books from your Markdown files, templates and styles.",
    ui_pick_dir: "Select book folder",
    ui_pick_files: "Upload files manually",
    ui_drop: "Or drop the whole Book folder here (Pages, Styles, Templates, Fonts, Images)",
    ui_generate: "Create PDF",
    ui_no_files: "Nothing loaded yet.",
    ui_status_idle: "Ready.",
    ui_fsa_warning: "This browser doesn't support writing directly to a folder (File System Access API), so default files won't be copied in automatically and the finished book will be downloaded instead of saved into the folder. Use Chrome or Edge for full functionality.",
    log_loaded_dir: "Folder loaded: {name}",
    log_first_run: "First run – setting up default structure.",
    log_synced: "Added missing default files: {list}",
    log_skipped_defaults: "Not filled in (unavailable, set DEFAULT_BOOK_BASE_URL): {list}",
    log_building: "Building document: {name}",
    log_rendering_page: "Page {page}/{count} ({name})",
    log_saved_folder: "Book saved into folder as {name}",
    log_saved_download: "Book downloaded as {name}",
    log_error: "Error: {message}",
    log_no_chapters: "No chapter_XX.md files found in Pages."
}
};

function getLanguage() {
    const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return TEXTS[nav] ? nav : "en";
}

const LANGUAGE = getLanguage();

/* ------------------------------------------------------------
   KONFIGURACE: odkud stahovat výchozí "Book" strukturu, pokud
   ve vybrané složce něco chybí (Templates, Styles, Fonts, Images,
   Pages). Web appka na rozdíl od Python verze nemá vlastní
   soubory "přibalené vedle sebe", takže je stahuje z GitHubu.

   Nastav na raw.githubusercontent.com adresu složky Book, např.:
   "https://raw.githubusercontent.com/UZIVATEL/REPO/main/Book/"
   (musí končit lomítkem). Když necháš prázdné, použijí se jen
   textové (ne-binární) výchozí hodnoty zabudované níže a fonty/
   obrázek pozadí se nedoplní automaticky.
   ------------------------------------------------------------ */
const DEFAULT_BOOK_BASE_URL = "https://raw.githubusercontent.com/PepikVaio/iPad_Test/main/Book/";

const DEFAULT_BOOK_FILES = [
    "Templates/template_cover.html",
    "Templates/template_chapter.html",
    "Styles/style_body.css",
    "Styles/style_chapter.css",
    "Styles/style_cover.css",
    "Styles/style_font.css",
    "Pages/description.md",
    "Pages/chapter_01.md",
    "Fonts/header.ttf",
    "Fonts/paragraph.ttf",
    "Fonts/quote.ttf",
    "Fonts/subtitle.ttf",
    "Images/cover.png"
];

function isBinaryAsset(relOrBaseName) {
    return /\.(ttf|otf|png|jpe?g)$/i.test(relOrBaseName);
}

async function fetchDefaultBookFile(relPath) {
    if (!DEFAULT_BOOK_BASE_URL) return null;
    try {
        const res = await fetch(DEFAULT_BOOK_BASE_URL + relPath);
        if (!res.ok) return null;
        if (isBinaryAsset(relPath)) {
            return { binary: true, buffer: await res.arrayBuffer() };
        }
        return { binary: false, text: await res.text() };
    } catch {
        return null; // offline / CORS / soubor v repu neexistuje – tiše přeskočíme
    }
}

function t(key, params) {
    let str = TEXTS[LANGUAGE][key] || key;
    if (params) {
        for (const [k, v] of Object.entries(params)) {
            str = str.replace(`{${k}}`, v);
        }
    }
    return str;
}

function applyLanguage() {
    document.documentElement.lang = LANGUAGE;
    document.getElementById("pageTitle").textContent = "Bindery";
    document.getElementById("subtitle").textContent = t("ui_subtitle");
    document.getElementById("btnPickDir").textContent = t("ui_pick_dir");
    document.getElementById("btnPickFiles").textContent = t("ui_pick_files");
    document.getElementById("drop").textContent = t("ui_drop");
    document.getElementById("generate").textContent = t("ui_generate");
    document.getElementById("fileSummary").textContent = t("ui_no_files");
    document.getElementById("statusLine").textContent = t("ui_status_idle");
    document.getElementById("infoOk").textContent = LANGUAGE === "cs" ? "Rozumím" : "Got it";
}

applyLanguage();

/* ============================================================
   2) VÝCHOZÍ "Book" STRUKTURA  (ekvivalent sync_Book() v Pythonu)
   ------------------------------------------------------------
   Python při prvním spuštění zkopíruje do vybrané složky svoji
   vlastní přibalenou složku Book/ (Templates, Styles, Fonts,
   Images, Pages) – ale jen ty soubory, které tam ještě nejsou.
   Sem přikládám výchozí Templates a Styles tak, jak byly dodané.
   Fonty a Images/cover.png v tomto projektu nejsou k dispozici,
   takže se nekopírují automaticky – uživatel si je do složky
   jednoduše přidá a Bindery je při dalším běhu normálně načte
   (přesně jako v Pythonu, kde uživatel do složky cokoliv přidá).
   ============================================================ */

const DEFAULT_BOOK = {
    "Templates/template_cover.html":
`<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
    {{STYLES}}
    <style></style>
</head>

<body class="cover">
    <div class="background"></div>
    <header>
        <h1>{{TITLE}}</h1>
        <h2>{{SUBTITLE}}</h2>
    </header>

    <footer>
        <p>{{AUTHOR}}</p>
    </footer>
</body>
</html>
`,
    "Templates/template_chapter.html":
`<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
    {{STYLES}}
    <style></style>
</head>

<body class="chapter">
    <div class="background"></div>
    {{CONTENT}}
</body>
</html>
`,
    "Styles/style_body.css":
`:root {
    --page_Width: 1241px;
    --page_Height: 1755px;
    --body_Padding: 50px;

@page { size: var(--page_Width) var(--page_Height); margin: 0; padding: 0; }

`,

    "Styles/style_chapter.css":

`,
    "Styles/style_font.css":

`,
    "Pages/description.md":
`# Title

cs

`,
    "Pages/chapter_01.md":
`# Kapitola první

Sem napiš text své první kapitoly.
`
};


/* ============================================================
   3) STAV APLIKACE, NOTIFIKACE, LOG
   ============================================================ */

const state = {
    dirHandle: null,        // File System Access API handle (pokud podporováno)
    filesMode: "none",      // "dir" | "manual" | "none"
    md: {},                 // filename.md -> text (description.md + chapter_*.md + libovolné další)
    stylesFiles: {},        // filename.css -> text
    templates: {},          // "cover"|"chapter"|... -> html text
    assets: {}              // filename(lowercase) -> blob URL (fonty .ttf/.otf, obrázky .png/.jpg)
};

const logEl = document.getElementById("log");
const statusLine = document.getElementById("statusLine");
const toastEl = document.getElementById("toast");

function log(msg) {
    logEl.textContent += msg + "\n";
    logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(msg) {
    statusLine.textContent = msg;
}

let toastTimer = null;
function showToast(message) {
    // Ekvivalent show_Notification() z Pythonu (nativní OS notifikace).
    // Nejdřív zkusíme opravdovou Notification API, vždy navíc ukážeme
    // i in-page toast, protože povolení notifikací nemusí být uděleno.
    toastEl.textContent = message;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 5000);

    if ("Notification" in window) {
        if (Notification.permission === "granted") {
            new Notification("Bindery", { body: message });
        } else if (Notification.permission !== "denied") {
            Notification.requestPermission().then((perm) => {
                if (perm === "granted") new Notification("Bindery", { body: message });
            });
        }
    }
}

function showInfoDialog(message) {
    return new Promise((resolve) => {
        const dialog = document.getElementById("infoDialog");
        document.getElementById("infoContent").textContent = message;
        dialog.showModal();
        document.getElementById("infoOk").onclick = () => { dialog.close(); resolve(); };
    });
}


/* ============================================================
   4) VÝBĚR SLOŽKY + SYNC (ekvivalent select_Folder + sync_Book)
   ============================================================ */

const supportsFSA = "showDirectoryPicker" in window;

const fsaWarning = document.getElementById("fsaWarning");
if (!supportsFSA) {
    fsaWarning.textContent = t("ui_fsa_warning");
    fsaWarning.classList.add("show");
}
document.getElementById("btnPickFiles").style.display = supportsFSA ? "none" : "inline-block";
document.getElementById("btnPickDir").textContent = supportsFSA ? t("ui_pick_dir") : t("ui_pick_dir") + " (jen čtení)";

async function walkDirectory(dirHandle, prefix = "") {
    // vrátí pole {path, handle, kind}
    const out = [];
    for await (const [name, handle] of dirHandle.entries()) {
        const path = prefix ? `${prefix}/${name}` : name;
        if (handle.kind === "directory") {
            out.push(...await walkDirectory(handle, path));
        } else {
            out.push({ path, handle });
        }
    }
    return out;
}

async function ensureSubdir(dirHandle, relativeDirPath) {
    let current = dirHandle;
    for (const part of relativeDirPath.split("/").filter(Boolean)) {
        current = await current.getDirectoryHandle(part, { create: true });
    }
    return current;
}

async function fileExists(dirHandle, relativePath) {
    const parts = relativePath.split("/");
    const fileName = parts.pop();
    try {
        let dir = dirHandle;
        for (const part of parts) dir = await dir.getDirectoryHandle(part);
        await dir.getFileHandle(fileName);
        return true;
    } catch {
        return false;
    }
}

async function writeFile(dirHandle, relativePath, contents) {
    const parts = relativePath.split("/");
    const fileName = parts.pop();
    const dir = await ensureSubdir(dirHandle, parts.join("/"));
    const fileHandle = await dir.getFileHandle(fileName, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(contents);
    await writable.close();
}

async function syncBook(dirHandle) {
    const added = [];
    const skipped = [];

    for (const relativePath of DEFAULT_BOOK_FILES) {
        const exists = await fileExists(dirHandle, relativePath);
        if (exists) continue;

        const remote = await fetchDefaultBookFile(relativePath);

        if (remote) {
            await writeFile(dirHandle, relativePath, remote.binary ? remote.buffer : remote.text);
            added.push(relativePath);
        } else if (!isBinaryAsset(relativePath) && DEFAULT_BOOK[relativePath]) {
            await writeFile(dirHandle, relativePath, DEFAULT_BOOK[relativePath]);
            added.push(relativePath);
        } else {
            skipped.push(relativePath);
        }
    }

    return { added, skipped };
}

async function pickDirectory() {
    if (!supportsFSA) return;

    let dirHandle;
    try {
        dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
    } catch {
        return; // uživatel zrušil výběr
    }

    state.dirHandle = dirHandle;
    state.filesMode = "dir";
    log(t("log_loaded_dir", { name: dirHandle.name }));

    const hasDescription = await fileExists(dirHandle, "Pages/description.md");

    if (!hasDescription) {
        log(t("log_first_run"));
        await showInfoDialog(INFO[LANGUAGE]);
        const { added, skipped } = await syncBook(dirHandle);
        if (added.length) log(t("log_synced", { list: added.join(", ") }));
        if (skipped.length) log(t("log_skipped_defaults", { list: skipped.join(", ") }));
    }

    await loadFromDirectoryHandle(dirHandle);
}

async function loadFromDirectoryHandle(dirHandle) {
    resetLoadedState();
    state.dirHandle = dirHandle;
    state.filesMode = "dir";

    const entries = await walkDirectory(dirHandle);

    for (const { path, handle } of entries) {
        await ingestFile(path, handle);
    }

    await finishLoading();
}


/* ============================================================
   5) NAČÍTÁNÍ SOUBORŮ (FSA i ruční fallback) – libovolný soubor,
      žádná data napevno v HTML
   ============================================================ */

function resetLoadedState() {
    state.md = {};
    state.stylesFiles = {};
    state.templates = {};
    state.assets = {};
}

async function ingestFile(path, handleOrFile) {
    const file = handleOrFile.getFile ? await handleOrFile.getFile() : handleOrFile;
    const baseName = path.split("/").pop();
    const lowerBase = baseName.toLowerCase();

    if (lowerBase.endsWith(".md")) {
        state.md[baseName] = await file.text();
    } else if (lowerBase.endsWith(".css")) {
        state.stylesFiles[baseName] = await file.text();
    } else if (lowerBase.endsWith(".html") && lowerBase.startsWith("template_")) {
        const key = lowerBase.replace(/^template_/, "").replace(/\.html$/, "");
        state.templates[key] = await file.text();
    } else if (/\.(ttf|otf|png|jpe?g)$/i.test(lowerBase)) {
        // data: URI místo blob: URL – blob URL se nespolehlivě předává
        // do html2canvas interního klonování dokumentu (typický důvod,
        // proč fonty/pozadí "nechytnou").
        state.assets[lowerBase] = await fileToDataUrl(file, lowerBase);
    }
}

function guessMimeType(lowerBase) {
    if (lowerBase.endsWith(".ttf")) return "font/ttf";
    if (lowerBase.endsWith(".otf")) return "font/otf";
    if (lowerBase.endsWith(".png")) return "image/png";
    if (lowerBase.endsWith(".jpg") || lowerBase.endsWith(".jpeg")) return "image/jpeg";
    return "application/octet-stream";
}

async function fileToDataUrl(file, lowerBase) {
    const buffer = await file.arrayBuffer();
    return arrayBufferToDataUrl(buffer, lowerBase);
}

function arrayBufferToDataUrl(buffer, lowerBase) {
    const bytes = new Uint8Array(buffer);
    let binary = "";
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    const base64 = btoa(binary);
    return `data:${guessMimeType(lowerBase)};base64,${base64}`;
}

async function fillMissingDefaults() {
    // Ekvivalent sync_Book() pro in-memory stav: co chybí, zkusí se
    // dotáhnout z GitHubu (DEFAULT_BOOK_BASE_URL), jinak se použije
    // vestavěný textový fallback (Templates/Styles/Pages) – fonty a
    // obrázek pozadí bez nastavené URL doplnit nelze.
    for (const relPath of DEFAULT_BOOK_FILES) {
        const baseName = relPath.split("/").pop();
        const lowerBase = baseName.toLowerCase();

        if (relPath.startsWith("Templates/")) {
            const key = lowerBase.replace(/^template_/, "").replace(/\.html$/, "");
            if (state.templates[key]) continue;
        } else if (relPath.startsWith("Styles/")) {
            if (state.stylesFiles[baseName]) continue;
        } else if (relPath.startsWith("Pages/")) {
            if (state.md[baseName]) continue;
        } else {
            if (state.assets[lowerBase]) continue;
        }

        const remote = await fetchDefaultBookFile(relPath);

        if (remote) {
            if (remote.binary) {
                state.assets[lowerBase] = arrayBufferToDataUrl(remote.buffer, lowerBase);
            } else if (relPath.startsWith("Templates/")) {
                const key = lowerBase.replace(/^template_/, "").replace(/\.html$/, "");
                state.templates[key] = remote.text;
            } else if (relPath.startsWith("Styles/")) {
                state.stylesFiles[baseName] = remote.text;
            } else if (relPath.startsWith("Pages/")) {
                state.md[baseName] = remote.text;
            }
            continue;
        }

        if (!isBinaryAsset(relPath) && DEFAULT_BOOK[relPath]) {
            if (relPath.startsWith("Templates/")) {
                const key = lowerBase.replace(/^template_/, "").replace(/\.html$/, "");
                state.templates[key] = DEFAULT_BOOK[relPath];
            } else if (relPath.startsWith("Styles/")) {
                state.stylesFiles[baseName] = DEFAULT_BOOK[relPath];
            } else if (relPath.startsWith("Pages/")) {
                state.md[baseName] = DEFAULT_BOOK[relPath];
            }
        }
    }
}

async function finishLoading() {
    await fillMissingDefaults();
    renderFileSummary();
}

function renderFileSummary() {
    const mdChapters = Object.keys(state.md).filter((n) => n.toLowerCase() !== "description.md");
    const fontCount = Object.keys(state.assets).filter((n) => /\.(ttf|otf)$/i.test(n)).length;
    const hasImage = Object.keys(state.assets).some((n) => /\.(png|jpe?g)$/i.test(n));

    const parts = [];
    parts.push(`${mdChapters.length} ${LANGUAGE === "cs" ? "MD souborů" : "MD files"}`);
    parts.push(`${Object.keys(state.stylesFiles).length} CSS`);
    parts.push(`${Object.keys(state.templates).length} ${LANGUAGE === "cs" ? "šablon" : "templates"}`);
    if (fontCount) parts.push(`${fontCount} ${LANGUAGE === "cs" ? "fontů" : "fonts"}`);
    if (hasImage) parts.push(LANGUAGE === "cs" ? "pozadí obálky" : "cover background");

    document.getElementById("fileSummary").textContent = parts.join(" · ");
    document.getElementById("generate").disabled = mdChapters.length === 0;
}

async function traverseEntry(entry, path, out) {
    if (entry.isFile) {
        const file = await new Promise((res, rej) => entry.file(res, rej));
        out.push({ path: path + entry.name, file });
    } else if (entry.isDirectory) {
        const reader = entry.createReader();
        const children = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const child of children) {
            await traverseEntry(child, path + entry.name + "/", out);
        }
    }
}

async function handleManualFileList(fileList) {
    resetLoadedState();
    state.filesMode = "manual";
    state.dirHandle = null;

    for (const file of fileList) {
        await ingestFile(file.webkitRelativePath || file.name, file);
    }

    await finishLoading();
}

async function handleDataTransfer(dataTransfer) {
    const items = dataTransfer.items;

    if (supportsFSA && items && items.length && items[0].getAsFileSystemHandle) {
        try {
            const handle = await items[0].getAsFileSystemHandle();
            if (handle.kind === "directory") {
                log(t("log_loaded_dir", { name: handle.name }));
                const hasDescription = await fileExists(handle, "Pages/description.md");
                if (!hasDescription) {
                    log(t("log_first_run"));
                    await showInfoDialog(INFO[LANGUAGE]);
                    const { added, skipped } = await syncBook(handle);
                    if (added.length) log(t("log_synced", { list: added.join(", ") }));
                    if (skipped.length) log(t("log_skipped_defaults", { list: skipped.join(", ") }));
                }
                await loadFromDirectoryHandle(handle);
                return;
            }
        } catch {
            // pokračuj ručním fallbackem níže
        }
    }

    if (items && items.length && items[0].webkitGetAsEntry) {
        const out = [];
        for (const item of items) {
            const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
            if (entry) await traverseEntry(entry, "", out);
        }
        resetLoadedState();
        state.filesMode = "manual";
        state.dirHandle = null;
        for (const { path, file } of out) await ingestFile(path, file);
        await finishLoading();
        return;
    }

    await handleManualFileList(dataTransfer.files);
}

document.getElementById("folderInput").addEventListener("change", (e) => handleManualFileList(e.target.files));
document.getElementById("fileInput").addEventListener("change", (e) => handleManualFileList(e.target.files));

document.getElementById("btnPickDir").addEventListener("click", () => {
    if (supportsFSA) pickDirectory();
    else document.getElementById("folderInput").click();
});
document.getElementById("btnPickFiles").addEventListener("click", () => {
    document.getElementById("fileInput").click();
});

const dropZone = document.getElementById("drop");
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("over"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("over");
    handleDataTransfer(e.dataTransfer);
});


/* ============================================================
   6) SESTAVENÍ DOKUMENTŮ (ekvivalent create_Chapter / create_Document /
      load_Styles / load_Template / load_Data_Book / load_Markdown)
   ============================================================ */

function getRootVarPx(cssText, varName, fallback) {
    const match = cssText.match(new RegExp("--" + varName + "\\s*:\\s*([\\d.]+)px", "i"));
    return match ? parseFloat(match[1]) : fallback;
}

function resolveCssUrls(cssText) {
    // nahradí url("../Fonts/x.ttf") / url("../Images/cover.png") reálnými blob URL
    // souborů, které uživatel nahrál – podle názvu souboru.
    return cssText.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (full, quote, rawPath) => {
        const base = rawPath.split("/").pop().toLowerCase();
        return state.assets[base] ? `url("${state.assets[base]}")` : full;
    });
}

function mergedStyleText() {
    return Object.values(state.stylesFiles).join("\n");
}

function buildStylesBlock(documentName) {
    // ekvivalent load_Styles(): style_cover.css jen pro obálku,
    // style_chapter.css jen pro kapitolu, ostatní vždy; řazeno abecedně.
    const selected = Object.keys(state.stylesFiles)
        .filter((file) => file.toLowerCase().endsWith(".css"))
        .filter((file) => {
            let name = file.replace(/\.css$/i, "").toLowerCase();
            if (!name.startsWith("style_")) return false;
            name = name.slice(6);
            return !((name === "cover" || name === "chapter") && name !== documentName);
        })
        .sort((a, b) => a.localeCompare(b));

    return selected.map((file) => `<style>\n${resolveCssUrls(state.stylesFiles[file])}\n</style>`).join("\n    ");
}

function loadTemplate(documentName) {
    const tpl = state.templates[documentName];
    if (!tpl) {
        throw new Error(LANGUAGE === "cs"
            ? `Chybí šablona template_${documentName}.html`
            : `Missing template template_${documentName}.html`);
    }
    return tpl;
}

function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function createDocumentHtml(documentName, content, replacements) {
    const template = loadTemplate(documentName);
    const styles = buildStylesBlock(documentName);

    let html = template.replace("{{STYLES}}", styles).replace("{{CONTENT}}", content);

    if (replacements) {
        for (const [key, value] of Object.entries(replacements)) {
            html = html.split(`{{${key}}}`).join(escapeHtml(value || ""));
        }
    }

    return html;
}

function createChapterHtml(markdownText) {
    // stejné pořadí úprav jako create_Chapter() v Pythonu:
    // 1) uvozovky -> <span class="quote">, 2) řádky s '>' -> <p class="subtitle">
    let text = markdownText.replace(/"([^"\n]+)"/g, '<span class="quote">"$1"</span>');
    text = text.replace(/^>\s*(.+)$/gm, '<p class="subtitle">$1</p>');
    return marked.parse(text);
}

function parseSections(markdownText) {
    const sections = {};
    let currentSection = null;
    let currentLines = [];

    for (const line of markdownText.split("\n")) {
        const match = line.match(/^#\s+(.+?)\s*$/);
        if (match) {
            if (currentSection !== null) sections[currentSection] = currentLines.join("\n").trim();
            currentSection = match[1].trim().toLowerCase();
            currentLines = [];
            continue;
        }
        if (currentSection !== null) currentLines.push(line);
    }
    if (currentSection !== null) sections[currentSection] = currentLines.join("\n").trim();
    return sections;
}

function loadBookData() {
    const descriptionMd = state.md["description.md"];

    if (!descriptionMd) {
        return { title: "", subtitle: "", author: "", series: "", number: "", rating: "", tags: [], identifier: "", date: "", published: "", publisher: "", language: "", description: "" };
    }

    const sections = parseSections(descriptionMd);
    const tags = (sections["tags"] || "").split(",").map((s) => s.trim()).filter(Boolean);
    const descriptionHtml = sections["description"] ? marked.parse(sections["description"]) : "";

    return {
        title: sections["title"] || "",
        subtitle: sections["subtitle"] || "",
        author: sections["author"] || "",
        series: sections["series"] || "",
        number: sections["number"] || "",
        rating: sections["hodnocení"] || "",
        tags,
        identifier: sections["identifier"] || "",
        date: sections["date"] || "",
        published: sections["published"] || "",
        publisher: sections["publisher"] || "",
        language: sections["language"] || "",
        description: descriptionHtml
    };
}

function loadChapterFiles() {
    const files = Object.keys(state.md).filter((f) => f.toLowerCase() !== "description.md");

    files.sort((a, b) => {
        const nameA = a.replace(/\.md$/i, "").toLowerCase();
        const nameB = b.replace(/\.md$/i, "").toLowerCase();
        const mA = nameA.match(/^chapter_(\d+)$/);
        const mB = nameB.match(/^chapter_(\d+)$/);
        const keyA = mA ? [0, parseInt(mA[1], 10)] : [1, nameA];
        const keyB = mB ? [0, parseInt(mB[1], 10)] : [1, nameB];
        if (keyA[0] !== keyB[0]) return keyA[0] - keyB[0];
        return keyA[1] < keyB[1] ? -1 : keyA[1] > keyB[1] ? 1 : 0;
    });

    return files.map((file) => ({ file, content: createChapterHtml(state.md[file]) }));
}

function cleanFileName(filename) {
    let name = (filename || "").replace(/[<>:"/\\|?*]/g, "");
    name = name.replace(/\s+/g, " ").trim();
    name = name.replace(/[.\s]+$/g, "");
    return name || "book";
}

function stripTags(html) {
    const div = document.createElement("div");
    div.innerHTML = html;
    return div.textContent || div.innerText || "";
}

function getLayout() {
    const merged = mergedStyleText();
    return {
        pageWidthPx: getRootVarPx(merged, "page_Width", 1241),
        pageHeightPx: getRootVarPx(merged, "page_Height", 1755),
        bodyPaddingPx: getRootVarPx(merged, "body_Padding", 50)
    };
}


/* ============================================================
   7) SKUTEČNÉ VYKRESLENÍ HTML+CSS -> STRÁNKY PDF
      (žádné dohadování hodnot – reálný layout prohlížeče)
   ============================================================ */

function createHiddenIframe(widthPx, heightPx) {
    const iframe = document.createElement("iframe");
    iframe.style.position = "fixed";
    iframe.style.left = "-99999px";
    iframe.style.top = "0";
    iframe.style.border = "0";
    iframe.style.width = widthPx + "px";
    iframe.style.height = heightPx + "px";
    document.body.appendChild(iframe);
    return iframe;
}

function waitIframeLoad(iframe, srcdoc) {
    return new Promise((resolve) => {
        iframe.onload = () => resolve();
        iframe.srcdoc = srcdoc;
    });
}

async function waitFontsReady(doc) {
    if (doc.fonts && doc.fonts.ready) {
        try { await doc.fonts.ready; } catch { /* ignore */ }
    }
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
}

async function splitChapterIntoPageDocs(documentName, content, layout) {
    // Změří skutečně vyrenderovaný obsah (reálné CSS, reálné fonty) a
    // rozdělí ho po celých blokových elementech na jednotlivé fyzické
    // stránky – stejně jako reálné stránkování v tiskovém enginu, jen
    // bez dělení uprostřed odstavce (menší, ale bezpečná odchylka od
    // WeasyPrintu, viz poznámka v odpovědi).
    const measureIframe = createHiddenIframe(layout.pageWidthPx, 2000);
    await waitIframeLoad(measureIframe, createDocumentHtml(documentName, content));
    await waitFontsReady(measureIframe.contentDocument);

    const body = measureIframe.contentDocument.body;
    const nodes = Array.from(body.children).filter((el) => !el.classList.contains("background"));
    const contentAreaHeight = layout.pageHeightPx - 2 * layout.bodyPaddingPx;

    const pages = [[]];
    let currentHeight = 0;

    for (const node of nodes) {
        const h = node.getBoundingClientRect().height;
        if (currentHeight > 0 && currentHeight + h > contentAreaHeight) {
            pages.push([]);
            currentHeight = 0;
        }
        pages[pages.length - 1].push(node.outerHTML);
        currentHeight += h;
    }

    document.body.removeChild(measureIframe);

    return pages.map((nodeHtmlList) => createDocumentHtml(documentName, nodeHtmlList.join("\n")));
}

async function renderPageToPngDataUrl(fullHtmlDoc, pageWidthPx, pageHeightPx) {
    const iframe = createHiddenIframe(pageWidthPx, pageHeightPx);
    await waitIframeLoad(iframe, fullHtmlDoc);
    await waitFontsReady(iframe.contentDocument);

    const canvas = await html2canvas(iframe.contentDocument.body, {
        width: pageWidthPx,
        height: pageHeightPx,
        windowWidth: pageWidthPx,
        windowHeight: pageHeightPx,
        scale: 2,
        useCORS: true,
        backgroundColor: "#ffffff"
    });

    document.body.removeChild(iframe);
    return canvas.toDataURL("image/png");
}


/* ============================================================
   8) METADATA / XMP  (ekvivalent set_Xmp / set_Calibre_* v Pythonu)
   ============================================================ */

function xmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function parseDdMmYyyy(value) {
    const m = value.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    const [, d, mo, y] = m;
    return `${y}-${mo.padStart(2, "0")}-${d.padStart(2, "0")}`;
}

function buildXmpPacket(book) {
    const parts = [];
    parts.push('<?xpacket begin="\uFEFF" id="W5M0MpCehiHzreSzNTczkc9d"?>');
    parts.push('<x:xmpmeta xmlns:x="adobe:ns:meta/"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">');
    parts.push('<rdf:Description rdf:about=""');
    parts.push('  xmlns:dc="http://purl.org/dc/elements/1.1/"');
    parts.push('  xmlns:prism="http://prismstandard.org/namespaces/basic/2.0/"');
    parts.push('  xmlns:calibre="http://calibre-ebook.com/xmp-namespace"');
    parts.push('  xmlns:calibreSI="http://calibre-ebook.com/xmp-namespace-series-index"');
    parts.push('  xmlns:book="http://wajsar.cz/xmp/book/1.0/">');

    if (book.title) parts.push(`<dc:title><rdf:Alt><rdf:li xml:lang="x-default">${xmlEscape(book.title)}</rdf:li></rdf:Alt></dc:title>`);
    if (book.author) parts.push(`<dc:creator><rdf:Seq><rdf:li>${xmlEscape(book.author)}</rdf:li></rdf:Seq></dc:creator>`);
    if (book.tags && book.tags.length) parts.push(`<dc:subject><rdf:Bag>${book.tags.map((tg) => `<rdf:li>${xmlEscape(tg)}</rdf:li>`).join("")}</rdf:Bag></dc:subject>`);

    if (book.identifier && book.identifier.toLowerCase() !== "none") {
        if (book.identifier.toLowerCase().startsWith("isbn:")) {
            parts.push(`<prism:isbn>${xmlEscape(book.identifier.slice(5).trim())}</prism:isbn>`);
        } else {
            parts.push(`<dc:identifier>${xmlEscape(book.identifier)}</dc:identifier>`);
        }
    }

    if (book.published && book.published.toLowerCase() !== "none") {
        const d = parseDdMmYyyy(book.published);
        if (d) parts.push(`<dc:date><rdf:Seq><rdf:li>${d}T00:00:00+00:00</rdf:li></rdf:Seq></dc:date>`);
    }

    if (book.date && book.date.toLowerCase() !== "none") parts.push(`<book:Date>${xmlEscape(book.date)}</book:Date>`);
    if (book.publisher && book.publisher.toLowerCase() !== "none") parts.push(`<dc:publisher><rdf:Bag><rdf:li>${xmlEscape(book.publisher)}</rdf:li></rdf:Bag></dc:publisher>`);
    if (book.language && book.language.toLowerCase() !== "none") parts.push(`<dc:language><rdf:Bag><rdf:li>${xmlEscape(book.language)}</rdf:li></rdf:Bag></dc:language>`);
    if (book.description) parts.push(`<dc:description><rdf:Alt><rdf:li xml:lang="x-default">${xmlEscape(stripTags(book.description))}</rdf:li></rdf:Alt></dc:description>`);
    if (book.subtitle) parts.push(`<book:Subtitle>${xmlEscape(book.subtitle)}</book:Subtitle>`);

    if (book.series && book.series.toLowerCase() !== "none") {
        let seriesXml = `<calibre:series rdf:parseType="Resource"><rdf:value>${xmlEscape(book.series)}</rdf:value>`;
        if (book.number && book.number.toLowerCase() !== "none") seriesXml += `<calibreSI:series_index>${xmlEscape(book.number)}</calibreSI:series_index>`;
        seriesXml += `</calibre:series>`;
        parts.push(seriesXml);
    }

    if (book.rating && book.rating.toLowerCase() !== "none") {
        const stars = (book.rating.match(/\*/g) || []).length;
        if (stars > 0) parts.push(`<calibre:rating>${Math.min(stars * 2, 10)}</calibre:rating>`);
    }

    parts.push('<dc:format>application/pdf</dc:format>');
    parts.push('</rdf:Description></rdf:RDF></x:xmpmeta>');
    parts.push('<?xpacket end="w"?>');

    return parts.join("\n");
}

function attachXmpMetadata(pdfDoc, book) {
    const { PDFName, PDFRawStream } = PDFLib;
    const xmpBytes = new TextEncoder().encode(buildXmpPacket(book));
    const context = pdfDoc.context;

    const streamDict = context.obj({
        Type: PDFName.of("Metadata"),
        Subtype: PDFName.of("XML"),
        Length: xmpBytes.length
    });

    const stream = PDFRawStream.of(streamDict, xmpBytes);
    const ref = context.register(stream);
    pdfDoc.catalog.set(PDFName.of("Metadata"), ref);
}


/* ============================================================
   9) ULOŽENÍ VÝSTUPU (do složky přes FSA, jinak stažení)
   ============================================================ */

async function saveOutput(pdfBytes, outputName) {
    if (state.dirHandle) {
        try {
            await writeFile(state.dirHandle, outputName, pdfBytes);
            log(t("log_saved_folder", { name: outputName }));
            return;
        } catch (err) {
            log(t("log_error", { message: err.message }));
        }
    }

    const blob = new Blob([pdfBytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = outputName;
    a.click();
    URL.revokeObjectURL(url);
    log(t("log_saved_download", { name: outputName }));
}


/* ============================================================
   10) HLAVNÍ GENEROVÁNÍ  (ekvivalent create_Pdf())
   ============================================================ */

async function generatePdf() {
    const layout = getLayout();
    const book = loadBookData();
    const chapters = loadChapterFiles();

    if (chapters.length === 0) {
        log(t("log_no_chapters"));
        setStatus(t("log_no_chapters"));
        return;
    }

    setStatus(t("info_Generating"));
    showToast(t("info_Generating"));

    const chapterMeta = [];
    for (const { file, content } of chapters) {
        const name = file.replace(/\.md$/i, "").toLowerCase();
        if (name.startsWith("chapter_")) {
            const m = content.match(/<h1>(.*?)<\/h1>/);
            if (m) chapterMeta.push({ title: stripTags(m[1]), file });
        }
    }

    log(t("log_building", { name: "cover" }));
    const coverHtml = createDocumentHtml("cover", "", { TITLE: book.title, SUBTITLE: book.subtitle, AUTHOR: book.author });
    const coverPng = await renderPageToPngDataUrl(coverHtml, layout.pageWidthPx, layout.pageHeightPx);

    const chapterPagePngs = [];
    for (const { file, content } of chapters) {
        log(t("log_building", { name: file }));
        const pageDocs = await splitChapterIntoPageDocs("chapter", content, layout);
        const pngs = [];
        for (let i = 0; i < pageDocs.length; i++) {
            log(t("log_rendering_page", { page: i + 1, count: pageDocs.length, name: file }));
            pngs.push(await renderPageToPngDataUrl(pageDocs[i], layout.pageWidthPx, layout.pageHeightPx));
        }
        chapterPagePngs.push({ file, pngs });
    }

    const { PDFDocument, PDFName, PDFString, PDFArray, PDFNumber } = PDFLib;
    const pdfDoc = await PDFDocument.create();

    const pageWidthPt = layout.pageWidthPx * 0.75;
    const pageHeightPt = layout.pageHeightPx * 0.75;

    async function addImagePage(dataUrl) {
        const pngBytes = await (await fetch(dataUrl)).arrayBuffer();
        const png = await pdfDoc.embedPng(pngBytes);
        const page = pdfDoc.addPage([pageWidthPt, pageHeightPt]);
        page.drawImage(png, { x: 0, y: 0, width: pageWidthPt, height: pageHeightPt });
        return page;
    }

    await addImagePage(coverPng);

    const chapterStarts = [];
    for (const { file, pngs } of chapterPagePngs) {
        const startIndex = pdfDoc.getPageCount();
        for (const png of pngs) await addImagePage(png);

        const name = file.replace(/\.md$/i, "").toLowerCase();
        if (name.startsWith("chapter_")) {
            const meta = chapterMeta.find((c) => c.file === file);
            if (meta) chapterStarts.push({ title: meta.title, pageIndex: startIndex });
        }
    }

    if (chapterStarts.length > 0) {
        const context = pdfDoc.context;
        const outlineItemRefs = chapterStarts.map(() => context.nextRef());
        const outlinesRef = context.nextRef();

        chapterStarts.forEach((chapter, index) => {
            const pageRef = pdfDoc.getPage(chapter.pageIndex).ref;
            const dest = PDFArray.withContext(context);
            dest.push(pageRef);
            dest.push(PDFName.of("XYZ"));
            dest.push(context.obj(null));
            dest.push(context.obj(null));
            dest.push(context.obj(null));

            const dict = context.obj({ Title: PDFString.of(chapter.title), Parent: outlinesRef, Dest: dest });
            if (index > 0) dict.set(PDFName.of("Prev"), outlineItemRefs[index - 1]);
            if (index < outlineItemRefs.length - 1) dict.set(PDFName.of("Next"), outlineItemRefs[index + 1]);
            context.assign(outlineItemRefs[index], dict);
        });

        const outlinesDict = context.obj({
            Type: PDFName.of("Outlines"),
            First: outlineItemRefs[0],
            Last: outlineItemRefs[outlineItemRefs.length - 1],
            Count: PDFNumber.of(outlineItemRefs.length)
        });
        context.assign(outlinesRef, outlinesDict);
        pdfDoc.catalog.set(PDFName.of("Outlines"), outlinesRef);
    }

    pdfDoc.setTitle(book.title || "");
    if (book.author) pdfDoc.setAuthor(book.author);
    pdfDoc.setCreator("Bindery Web");
    pdfDoc.setProducer("Bindery Web");
    pdfDoc.setCreationDate(new Date());
    if (book.tags && book.tags.length) pdfDoc.setSubject(book.tags.join(", "));
    try { if (book.language) pdfDoc.setLanguage(book.language); } catch { /* verze pdf-lib nemusí podporovat */ }

    try {
        attachXmpMetadata(pdfDoc, book);
    } catch (err) {
        log(t("log_error", { message: "XMP: " + err.message }));
    }

    const pdfBytes = await pdfDoc.save();
    const outputName = `${cleanFileName(book.title)}.pdf`;

    await saveOutput(pdfBytes, outputName);

    setStatus(t("info_Done"));
    showToast(t("info_Done"));
}

document.getElementById("generate").addEventListener("click", async () => {
    const btn = document.getElementById("generate");
    btn.disabled = true;
    logEl.textContent = "";

    try {
        await generatePdf();
    } catch (err) {
        console.error(err);
        log(t("log_error", { message: err.message }));
        setStatus(t("log_error", { message: err.message }));
    } finally {
        btn.disabled = false;
    }
});
</script>
